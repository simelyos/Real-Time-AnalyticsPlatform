services:
  postgres:
    image: postgres:latest

    container_name: ecommerce-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce

    ports:
      - "5432:5432"

    volumes:
      - type: volume
        source: postgres_data
        target: /data
volumes:
  postgres_data:
